<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Connect With Us</h1>
        <p>Have questions or want to get in touch? <br>
            Fill out the form below and we'll get back to you as soon as possible.</p>
        <div class="contact-box">
            <div class="contact-left">
                <h1>Contact Form</h1>
                <form action="">
                    <div class="input-row">
                        <div class="input-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" placeholder="Enter your name">
                        </div>
                        <div class="input-group">
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" placeholder="Enter your phone number">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" placeholder="Enter your email">
                        </div>
                        <div class="input-group">
                            <label for="subject">Subject</label>
                            <input type="text" id="subject" placeholder="Product Demo here...">
                        </div>
                    </div>
                    <label for="message">Message</label>
                    <textarea rows="5" cols="50" id="message" placeholder="Enter your message"></textarea>
                    <button type="submit" class="send-message">Send Message</button>
                </form>
            </div>
            <div class="contact-right">
                <h1>Contact Information</h1>
                <table>
                    <tr>
                        <td><strong>Address:</strong></td>
                        <td>123 Main Street, Anytown, USA</td>
                    </tr>
                    <tr>
                        <td><strong>Phone:</strong></td>
                        <td>(123) 456-7890</td>
                    </tr>
                    <tr>
                        <td><strong>Email:</strong></td>
                        <td>info@example.com</td>
                    </tr>


                </table>


            </div>
        </div>
    </div>
</body>
</html>
