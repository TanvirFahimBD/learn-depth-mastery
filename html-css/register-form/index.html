<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <form action="">
        <i class="fa-solid fa-user"></i>
        <div class="input-box">
            <span><i class="fa-solid fa-user"></i></span><input type="text" name="" id="" placeholder="User Name" required>
        </div>
        <div class="input-box">
            <span><i class="fa-solid fa-envelope"></i></span><input type="email" name="" id="" placeholder="Email" required>
        </div>
        <div class="input-box">
            <span><i class="fa-solid fa-lock"></i></span><input type="password" name="" id="" placeholder="Password" required>
        </div>
        <button type="submit"><i class="fa-solid fa-sign-in"></i> Register</button>
    </form>
</body>
</html>
