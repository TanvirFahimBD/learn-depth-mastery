<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="hero">
        <div class="navbar">
            <img src="./assets/logo.png" alt="" class="logo">
            <div class="user">
                <button type="button">Explore</button>
                <img src="./assets/user.png" alt="" class="">
            </div>
        </div>
        <div class="container">
            <div class="info">
                <h1>DISCOVER</h1>
                <p>Discover amazing experiences with our platform. <br>Life is too short to live without adventure.
                    Enjoy every moment!</p>
                <input type="text" placeholder="Search">
            </div>
        </div>

        <div class="slider">
            <img src="./assets/left-arrow.png" alt="" id="prev">

            <div class="preview">
                <img  src="./assets/small1.png" alt="" class=" thumbnail active">
                <img src="./assets/small2.png" alt="" class="thumbnail">
                <img src="./assets/small3.png" alt="" class="thumbnail">
                <img src="./assets/small4.png" alt="" class="thumbnail">
                <img src="./assets/small5.png" alt="" class="thumbnail">
            </div>

            <img src="./assets/right-arrow.png" alt="" id="next">
        </div>

    </div>


    <script>

        var prev = document.getElementById("prev");
        var next = document.getElementById("next");
        var thumbnails = document.getElementsByClassName("thumbnail");
        var hero = document.getElementById("hero");

        var backgroundImg = new Array(
            "./assets/bg1.png",
            "./assets/bg2.png",
            "./assets/bg3.png",
            "./assets/bg4.png",
            "./assets/bg5.png"
        );

        let i = 0;
        console.log("out", i);
        next.onclick = function (){            
            if(i<4){
                hero.style.backgroundImage = "url(" + backgroundImg[i+1] + ")";
                thumbnails[i].classList.remove("active");
                thumbnails[i+1].classList.add("active");
                i++;
            }            thumbnails
        }
        
        prev.onclick = function (){            
            if(i>0){
                hero.style.backgroundImage = "url(" + backgroundImg[i-1] + ")";
                thumbnails[i-1].classList.add("active");
                thumbnails[i].classList.remove("active");
                i--;
            }            
        }



    </script>




</body>

</html>
