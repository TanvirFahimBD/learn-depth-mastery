<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="left-col">
            <img src="./assets/logo.png" alt="" class="logo">
            <div class="content">
                <h1>Add Plants so that home stay green</h1>
                <p>Join us in our mission to make the world a greener place by adding more plants.</p>
                <button type="button">LEARN MORE</button>
            </div>
        </div>
        <div class="right-col">
            <div class="slider">
                <img src="./assets/pic-1.jpg" alt="" id="Slide">
            </div>
            <div class="slider-content">
                <h2>Beautiful Indoor Plants</h2>
                <hr>
                <p>Discover the joy of bringing nature indoors with our collection of beautiful indoor plants.</p>

                <div class="controller">
                    <img src="./assets/back.png" alt="" id="BackBtn">
                    <div class="vertical-line"></div>
                    <img src="./assets/next.png" alt="" id="NextBtn">
                </div>
            </div>
        </div>
    </div>

    <script>
        
        const BackBtn = document.getElementById('BackBtn');
        const NextBtn = document.getElementById('NextBtn');
        const Slide = document.getElementById('Slide');

        var slides = ['./assets/pic-1.jpg', './assets/pic-2.jpg', './assets/pic-3.jpg', './assets/pic-4.jpg'];

        let i = 0;
        BackBtn.addEventListener('click', () => {
            if(i>0){
                Slide.src = slides[i-1];
                i--;
            }            
        });

        NextBtn.addEventListener('click', () => {
            if(i<3){
                Slide.src = slides[i+1];
                i++;
            } 
        });
    
    </script>







</body>
</html>
